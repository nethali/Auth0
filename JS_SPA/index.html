<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production-Ready Auth0 SPA Sample</title>
    <!-- Auth0 SPA SDK via official CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@auth0/auth0-spa-js@2.1.3/dist/auth0-spa-js.production.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        button { background: #635bff; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #4b45c6; }
        pre { background: #1e1e1e; color: #00ff66; padding: 1rem; border-radius: 4px; overflow-x: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SPA Identity Management</h1>
        <p id="status-text">Initializing authentication system...</p>

        <div id="auth-actions">
            <button id="btn-login" class="hidden" onclick="login()">Log In</button>
            <button id="btn-logout" class="hidden" onclick="logout()">Log Out</button>
        </div>

        <div id="user-profile" class="hidden">
            <h3>Authenticated User Profile</h3>
            <pre id="profile-data"></pre>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // Application Configuration
        // -------------------------------------------------------------
        const AUTH0_CONFIG = {
            domain: "YOUR_AUTH0_DOMAIN.auth0.com", // Replace with your domain
            clientId: "YOUR_AUTH0_CLIENT_ID"       // Replace with your Public Client ID
        };

        let auth0Client = null;

        /**
         * Initializes the Auth0 SPA SDK instance.
         */
        async function initAuth0() {
            try {
                auth0Client = await auth0.createAuth0Client({
                    domain: AUTH0_CONFIG.domain,
                    clientId: AUTH0_CONFIG.clientId,
                    authorizationParams: {
                        redirect_uri: window.location.origin
                    },
                    // Recommended setting: Cache tokens in memory to prevent XSS exfiltration
                    cacheLocation: 'memory'
                });

                // Check if returning from Auth0 redirect callback
                const query = window.location.search;
                if (query.includes("code=") && query.includes("state=")) {
                    await auth0Client.handleRedirectCallback();
                    // Clean URL bar parameters without causing page reload
                    window.history.replaceState({}, document.title, window.location.pathname);
                }

                await renderUI();
            } catch (error) {
                console.error("Authentication initialization failed:", error);
                document.getElementById("status-text").textContent = "Error initializing authentication.";
            }
        }

        /**
         * Renders stateful UI based on current authentication condition.
         */
        async function renderUI() {
            const isAuthenticated = await auth0Client.isAuthenticated();
            const loginBtn = document.getElementById("btn-login");
            const logoutBtn = document.getElementById("btn-logout");
            const profileDiv = document.getElementById("user-profile");
            const statusText = document.getElementById("status-text");

            if (isAuthenticated) {
                const user = await auth0Client.getUser();
                statusText.textContent = `Welcome back, ${user.name || user.email}!`;
                loginBtn.classList.add("hidden");
                logoutBtn.classList.remove("hidden");
                profileDiv.classList.remove("hidden");
                document.getElementById("profile-data").textContent = JSON.stringify(user, null, 2);
            } else {
                statusText.textContent = "You are currently unauthenticated.";
                loginBtn.classList.remove("hidden");
                logoutBtn.classList.add("hidden");
                profileDiv.classList.add("hidden");
            }
        }

        /**
         * Triggers explicit authentication redirect.
         */
        async function login() {
            await auth0Client.loginWithRedirect();
        }

        /**
         * Logs user out and terminates session at the Authorization Server.
         */
        async function logout() {
            await auth0Client.logout({
                logoutParams: {
                    returnTo: window.location.origin
                }
            });
        }

        // Bootstrap on DOM load
        window.onload = initAuth0;
    </script>
</body>
</html>
